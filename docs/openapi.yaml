openapi: 3.1.0
info:
  title: STOCKER API
  version: 0.1.0
  description: Evidence-first Indian equity research API. All timestamps are UTC. Signals are informational and not financial advice.
servers: [{url: http://localhost:8080/api/v1}]
tags:
  - {name: Authentication}
  - {name: Market}
  - {name: Stocks}
  - {name: News}
  - {name: Portfolio}
  - {name: Alerts}
  - {name: Evaluation}
  - {name: System}
paths:
  /auth/register:
    post:
      tags: [Authentication]
      operationId: register
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RegisterInput'}}}}
      responses: {'201': {description: Registered, content: {application/json: {schema: {$ref: '#/components/schemas/AuthResponse'}}}}, '409': {$ref: '#/components/responses/Conflict'}}
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginInput'}}}}
      responses: {'200': {description: Signed in, content: {application/json: {schema: {$ref: '#/components/schemas/AuthResponse'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}}
  /auth/refresh:
    post:
      tags: [Authentication]
      operationId: refresh
      responses: {'200': {description: Refresh cookie rotated}, '401': {$ref: '#/components/responses/Unauthorized'}}
  /auth/logout:
    post: {tags: [Authentication], operationId: logout, responses: {'204': {description: Session revoked}}}
  /auth/me:
    get: {tags: [Authentication], security: [{bearerAuth: []}], operationId: getCurrentUser, responses: {'200': {description: Current authenticated user}, '401': {$ref: '#/components/responses/Unauthorized'}}}
  /market/overview:
    get: {tags: [Market], operationId: getMarketOverview, responses: {'200': {description: Indices, breadth and explained mood, content: {application/json: {schema: {type: object}}}}}}
  /market/sectors:
    get: {tags: [Market], operationId: getMarketSectors, responses: {'200': {description: Sector breadth and average latest move computed from persisted provider snapshots}}}
  /market/movers:
    get: {tags: [Market], operationId: getMarketMovers, parameters: [{name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 10}}], responses: {'200': {description: Securities sorted by absolute daily move}}}
  /stocks/search:
    get:
      tags: [Stocks]
      operationId: searchStocks
      parameters: [{name: q, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 100}}]
      responses: {'200': {description: Matching security master rows, content: {application/json: {schema: {$ref: '#/components/schemas/SecurityList'}}}}}
  /stocks/{symbol}:
    get:
      tags: [Stocks]
      operationId: getStock
      parameters: [{$ref: '#/components/parameters/Symbol'}]
      responses: {'200': {description: Security, latest quote/fundamentals, same-sector peers and deterministic risk flags}, '404': {$ref: '#/components/responses/NotFound'}}
  /stocks/{symbol}/quote:
    get: {tags: [Stocks], operationId: getStockQuote, parameters: [{$ref: '#/components/parameters/Symbol'}], responses: {'200': {description: Quote with source URL, delay, market as-of and retrieval timestamps}}}
  /stocks/{symbol}/fundamentals:
    get: {tags: [Stocks], operationId: getStockFundamentals, parameters: [{$ref: '#/components/parameters/Symbol'}], responses: {'200': {description: Point-in-time metrics carrying source, period, unit and basis}}}
  /stocks/{symbol}/peers:
    get: {tags: [Stocks], operationId: getStockPeers, parameters: [{$ref: '#/components/parameters/Symbol'}], responses: {'200': {description: Same-sector peer snapshots}}}
  /stocks/{symbol}/risk-flags:
    get: {tags: [Stocks], operationId: getStockRiskFlags, parameters: [{$ref: '#/components/parameters/Symbol'}], responses: {'200': {description: Deterministic freshness, drawdown, daily-move, earnings and provider flags}}}
  /stocks/{symbol}/news:
    get: {tags: [Stocks, News], operationId: getStockNews, parameters: [{$ref: '#/components/parameters/Symbol'}], responses: {'200': {description: MongoDB-backed attributed and clustered news, content: {application/json: {schema: {$ref: '#/components/schemas/NewsList'}}}}}}
  /stocks/{symbol}/signals:
    get: {tags: [Stocks], operationId: getStockSignals, parameters: [{$ref: '#/components/parameters/Symbol'}], responses: {'200': {description: Append-only source-linked signal history, content: {application/json: {schema: {type: object}}}}, '404': {$ref: '#/components/responses/NotFound'}}}
  /news:
    get:
      tags: [News]
      operationId: listNews
      parameters:
        - {name: stock, in: query, schema: {type: string}}
        - {name: sector, in: query, schema: {type: string}}
        - {name: source, in: query, schema: {type: string}}
        - {name: officialOnly, in: query, schema: {type: boolean}}
        - {name: language, in: query, schema: {type: string}}
        - {name: q, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      responses: {'200': {description: Filtered, clustered and attributed news, content: {application/json: {schema: {$ref: '#/components/schemas/NewsList'}}}}, '400': {description: Invalid filter}}
  /news/{id}:
    get: {tags: [News], operationId: getNews, parameters: [{name: id, in: path, required: true, schema: {$ref: '#/components/schemas/ObjectId'}}], responses: {'200': {description: Retained article evidence and source policy metadata, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/NewsArticle'}, meta: {type: object}}}}}}, '404': {$ref: '#/components/responses/NotFound'}}}
  /news/{id}/analysis:
    get: {tags: [News], operationId: getNewsAnalysis, parameters: [{name: id, in: path, required: true, schema: {$ref: '#/components/schemas/ObjectId'}}], responses: {'200': {description: Latest append-only schema-valid grounded analysis and linked signals, content: {application/json: {schema: {type: object}}}}, '404': {description: Analysis not available}}}
  /news/{id}/impact:
    get: {tags: [News, Portfolio], security: [{bearerAuth: []}], operationId: getNewsImpact, parameters: [{name: id, in: path, required: true, schema: {$ref: '#/components/schemas/ObjectId'}}], responses: {'200': {description: Bullish, bearish or mixed stock impact separated into non-portfolio market stocks and current portfolio holdings; confidence is intentionally omitted}, '401': {$ref: '#/components/responses/Unauthorized'}}}
  /events:
    get: {tags: [Market], operationId: listEvents, parameters: [{name: symbol, in: query, schema: {type: string}}, {name: from, in: query, schema: {type: string, format: date-time}}], responses: {'200': {description: Event calendar derived from persisted, grounded news analyses}}}
  /portfolio:
    get: {tags: [Portfolio], security: [{bearerAuth: []}], operationId: getPortfolio, responses: {'200': {description: Holdings with current value and profit/loss summary, content: {application/json: {schema: {$ref: '#/components/schemas/PortfolioResponse'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}}}
    post:
      tags: [Portfolio]
      security: [{bearerAuth: []}]
      operationId: addPortfolioHolding
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [symbol, quantity, averageBuyPrice], properties: {symbol: {type: string, maxLength: 24}, quantity: {type: number, exclusiveMinimum: 0, maximum: 1000000000}, averageBuyPrice: {type: number, exclusiveMinimum: 0, maximum: 1000000000}}}}}}
      responses: {'201': {description: Holding added}, '409': {$ref: '#/components/responses/Conflict'}, '422': {description: Fifty-holding limit reached}}
  /portfolio/news:
    get: {tags: [Portfolio, News], security: [{bearerAuth: []}], operationId: getPortfolioNews, responses: {'200': {description: Up to 30 recent deduplicated stories linked to portfolio holdings, content: {application/json: {schema: {$ref: '#/components/schemas/NewsList'}}}}}}
  /refresh:
    post: {tags: [Market, Portfolio], security: [{bearerAuth: []}], operationId: refreshEverything, responses: {'200': {description: Force-refreshes live quotes and fundamentals for every portfolio holding; clients then reload all visible data}, '401': {$ref: '#/components/responses/Unauthorized'}, '503': {description: Live market refresh unavailable}}}
  /portfolio/{symbol}:
    delete: {tags: [Portfolio], security: [{bearerAuth: []}], operationId: removePortfolioHolding, parameters: [{$ref: '#/components/parameters/Symbol'}], responses: {'204': {description: Holding removed}}}
    patch:
      tags: [Portfolio]
      security: [{bearerAuth: []}]
      operationId: updatePortfolioHolding
      parameters: [{$ref: '#/components/parameters/Symbol'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, minProperties: 1, properties: {quantity: {type: number, exclusiveMinimum: 0}, averageBuyPrice: {type: number, exclusiveMinimum: 0}, alertsPaused: {type: boolean}}}}}}
      responses: {'200': {description: Updated}}
  /portfolio/{symbol}/ai-advice:
    get: {tags: [Portfolio], security: [{bearerAuth: []}], operationId: getPortfolioAIAdvice, parameters: [{$ref: '#/components/parameters/Symbol'}], responses: {'200': {description: Public-data-only AI stock advice, or an explicit unavailable result when no approved AI endpoint/key is configured}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}}}
  /alerts:
    get: {tags: [Alerts], security: [{bearerAuth: []}], operationId: listAlerts, responses: {'200': {description: Deduplicated alert history}}}
  /alerts/{id}/read:
    patch: {tags: [Alerts], security: [{bearerAuth: []}], operationId: markAlertRead, parameters: [{name: id, in: path, required: true, schema: {$ref: '#/components/schemas/ObjectId'}}], responses: {'200': {description: Alert marked read}, '404': {$ref: '#/components/responses/NotFound'}}}
  /alert-rules:
    get: {tags: [Alerts], security: [{bearerAuth: []}], operationId: listAlertRules, responses: {'200': {description: User-owned active and paused rules}}}
    post:
      tags: [Alerts]
      security: [{bearerAuth: []}]
      operationId: createAlertRule
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AlertRuleInput'}}}}
      responses: {'201': {description: Created and immediately evaluated}, '422': {description: Stock is not in the portfolio or rule limit reached}}
  /alert-rules/{id}:
    patch: {tags: [Alerts], security: [{bearerAuth: []}], operationId: updateAlertRule, parameters: [{name: id, in: path, required: true, schema: {$ref: '#/components/schemas/ObjectId'}}], responses: {'200': {description: Updated and evaluated when enabled}, '404': {$ref: '#/components/responses/NotFound'}}}
    delete: {tags: [Alerts], security: [{bearerAuth: []}], operationId: revokeAlertRule, parameters: [{name: id, in: path, required: true, schema: {$ref: '#/components/schemas/ObjectId'}}], responses: {'204': {description: Delivery revoked; alert history retained}, '404': {$ref: '#/components/responses/NotFound'}}}
  /briefings:
    get:
      tags: [Alerts]
      security: [{bearerAuth: []}]
      operationId: getBriefing
      parameters: [{name: kind, in: query, schema: {enum: [morning, closing, daily], default: daily}}]
      responses: {'200': {description: Evidence-grounded portfolio briefing}}
  /evaluation/report:
    get:
      tags: [Evaluation]
      security: [{bearerAuth: []}]
      operationId: getEvaluationReport
      parameters:
        - {name: asOf, in: query, schema: {type: string, format: date-time}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 10000, default: 5000}}
      responses:
        '200': {description: Event-time historical outcomes, leakage violations, and accuracy/precision slices by confidence band, category, sector and horizon}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /system/source-health:
    get: {tags: [System], operationId: getSourceHealth, responses: {'200': {description: Polling and parser health}}}
  /stream:
    get: {security: [{bearerAuth: []}], operationId: streamUpdates, description: Authenticated SSE near-real-time stream; delivery speed is bounded by provider policy., responses: {'200': {description: text/event-stream, content: {text/event-stream: {schema: {type: string}}}}, '401': {$ref: '#/components/responses/Unauthorized'}}}
components:
  securitySchemes: {bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}}
  parameters:
    Symbol: {name: symbol, in: path, required: true, schema: {type: string, maxLength: 32}}
  responses:
    Unauthorized: {description: Authentication required}
    NotFound: {description: Resource not found}
    Conflict: {description: Resource already exists}
  schemas:
    RegisterInput: {type: object, additionalProperties: false, required: [email, password, displayName], properties: {email: {type: string, format: email, maxLength: 254}, password: {type: string, minLength: 12, maxLength: 128}, displayName: {type: string, minLength: 2, maxLength: 80}}}
    LoginInput: {type: object, additionalProperties: false, required: [email, password], properties: {email: {type: string, format: email}, password: {type: string}}}
    AuthResponse: {type: object, required: [accessToken, expiresIn, user], properties: {accessToken: {type: string}, expiresIn: {type: integer}, user: {type: object, properties: {id: {$ref: '#/components/schemas/ObjectId'}, email: {type: string}, displayName: {type: string}, role: {type: string}}}}}
    ObjectId: {type: string, pattern: '^[a-f0-9]{24}$', description: MongoDB ObjectID encoded as lowercase hexadecimal}
    AlertChannels:
      type: object
      required: [inApp]
      properties: {inApp: {type: boolean, const: true}, browser: {type: boolean, description: Preference only; provider not configured}, email: {type: boolean, description: Preference only; provider not configured}, telegram: {type: boolean, description: Preference only; provider not configured}}
    QuietHours:
      type: object
      properties: {enabled: {type: boolean}, start: {type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$'}, end: {type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$'}, timezone: {type: string, default: Asia/Kolkata}}
    AlertRuleInput:
      type: object
      required: [name, symbol, ruleType]
      properties:
        name: {type: string, minLength: 3, maxLength: 80}
        symbol: {type: string, maxLength: 24}
        ruleType: {enum: [event, price_above, price_below, change_above, change_below]}
        threshold: {type: number, exclusiveMinimum: 0}
        eventCategories: {type: array, maxItems: 10, items: {type: string}}
        minimumConfidence: {type: integer, minimum: 0, maximum: 100, default: 0}
        minimumSeverity: {enum: [low, medium, high], default: low}
        cooldownMinutes: {type: integer, minimum: 1, maximum: 10080, default: 60}
        channels: {$ref: '#/components/schemas/AlertChannels'}
        quietHours: {$ref: '#/components/schemas/QuietHours'}
        enabled: {type: boolean, default: true}
    Security:
      type: object
      required: [id, companyName, sector, industry, price, changePercent, signal, newsCount, asOf, source]
      properties:
        id: {$ref: '#/components/schemas/ObjectId'}
        nseSymbol: {type: string}
        bseCode: {type: string}
        isin: {type: string}
        companyName: {type: string}
        sector: {type: string}
        industry: {type: string}
        price: {type: number}
        changePercent: {type: number}
        signal: {enum: [Strong positive setup, Positive setup, Neutral/watch, Negative setup, Strong negative setup, Insufficient evidence]}
        newsCount: {type: integer}
        asOf: {type: string, format: date-time}
        source: {type: string}
        alertsPaused: {type: boolean}
    SecurityList: {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/Security'}}, meta: {type: object}}}
    PortfolioHolding:
      allOf:
        - {$ref: '#/components/schemas/Security'}
        - {type: object, required: [quantity, averageBuyPrice, investedValue, currentValue, pnl, pnlPercent, dayPnl, detailsComplete, alertsPaused, addedAt], properties: {quantity: {type: number}, averageBuyPrice: {type: number}, investedValue: {type: number}, currentValue: {type: number}, pnl: {type: number}, pnlPercent: {type: number}, dayPnl: {type: number}, detailsComplete: {type: boolean}, alertsPaused: {type: boolean}, addedAt: {type: string, format: date-time}}}
    PortfolioSummary:
      type: object
      properties: {investedValue: {type: number}, currentValue: {type: number}, pnl: {type: number}, pnlPercent: {type: number}, dayPnl: {type: number}, holdingCount: {type: integer}}
    PortfolioResponse:
      type: object
      properties: {data: {type: array, items: {$ref: '#/components/schemas/PortfolioHolding'}}, meta: {type: object, properties: {count: {type: integer}, limit: {type: integer, const: 50}, summary: {$ref: '#/components/schemas/PortfolioSummary'}}}}
    NewsArticle:
      type: object
      required: [id, clusterId, title, body, sourceId, sourceName, sourceType, url, language, attribution, licence, parserVersion, publishedAt, retrievedAt, symbols, sectors, official, synthetic, duplicateCount]
      properties:
        id: {$ref: '#/components/schemas/ObjectId'}
        clusterId: {type: string}
        title: {type: string}
        body: {type: string, description: Retained text only when permitted by the source policy}
        sourceId: {type: string}
        sourceName: {type: string}
        sourceType: {enum: [mock, rss_atom, exchange_announcement, json_api, permitted_html]}
        url: {type: string, format: uri}
        author: {type: string}
        language: {type: string}
        attribution: {type: string}
        licence: {type: string}
        parserVersion: {type: string}
        publishedAt: {type: string, format: date-time}
        retrievedAt: {type: string, format: date-time}
        symbols: {type: array, items: {type: string}}
        sectors: {type: array, items: {type: string}}
        official: {type: boolean}
        synthetic: {type: boolean}
        duplicateCount: {type: integer, minimum: 1}
    NewsList: {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/NewsArticle'}}, meta: {type: object, properties: {page: {type: integer}, pageSize: {type: integer}, total: {type: integer}, totalPages: {type: integer}, clustered: {type: boolean}, syntheticOnly: {type: boolean}}}}}
